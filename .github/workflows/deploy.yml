name: Terraform Deploy

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::157664039021:role/it-tools-github-actions-role
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build, tag, and push docker image to Amazon ECR
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  REPOSITORY: it-tools-ecr
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker buildx build \
                  --platform linux/amd64 \
                  -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
                  --push \
                  .

    terraform-deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: infra

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup terraform
              uses: hashicorp/setup-terraform@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::157664039021:role/it-tools-github-actions-role
                  aws-region: us-east-1

            - name: Initialize terraform
              run: terraform init

            - name: Plan terraform
              run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan

            - name: Apply terraform
              run: terraform apply tfplan

    health-check:
        needs: terraform-deploy
        runs-on: ubuntu-latest

        steps:
            - name: Run a health check
              run: |
                  for i in {1..10}; do
                    if curl --fail --silent --show-error https://tm.magidali.com/health; then
                      echo "Health check passed"
                      exit 0
                    fi

                    echo "Waiting for application to become healthy..."
                    sleep 15
                  done

                  echo "Health check failed"
                  exit 1
